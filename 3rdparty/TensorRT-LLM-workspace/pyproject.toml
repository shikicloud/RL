  "plotly",
  "matplotlib",
  "openai",
]

[build-system]
# No extra build requirements here — build deps (torch, ninja, cmake, etc.)
# come from the main venv via no-build-isolation-package.
requires = []
build-backend = "_backend"
backend-path = ["."]

[tool.trtllm]
# Single source of truth for which TensorRT-LLM fork/commit the custom wheel
# builds. _backend.py reads these, folds them into the wheel cache key, and
# passes them to tools/build-custom-trtllm.sh as its required argv (the script
# itself takes no defaults). The wheel cache is ref-scoped, while the CI ccache
# image is scoped by base image and architecture so valid compiler objects can
# be reused across ref and uv-version changes. When bumping `ref`, also re-sync
# [project].dependencies against the new requirements.txt.
#
# Variant M (2026-09-15): public NVIDIA/TensorRT-LLM main 0beff32139 (1.3.0rc27)
# + PR #18231 (MNNVL AllReduce under the Ray orchestrator, incl. the RL fix
# that drops the AsyncLLM NCCL pin; merged over #16635's checkpoint/restore)
# + 3cc567a48b/b77e89f224 (MNNVL workspace prescale before breakable CUDA
# graph capture) + tekit cb96642106 (register the RPC result before the send)
# + tekit f880530e07 (TLLM_HANG_DETECTOR_TIMEOUT)
# + public PR #18300 (645efd145b, picked 2026-09-16: MoE MNNVL/all-to-all
# workspaces without MPI under Ray; needed by attention-DP engines, inert for
# TEP8). Branch
# user/shanshan/ultra_disagg_main on github.com/dominicshanshan/TensorRT-LLM;
# built from the local checkout because compute nodes clone from Lustre.
url = "/lustre/fsw/coreai_comparch_trtllm/dominicw/nano35_swe_benchmark/TensorRT-LLM"
ref = "a6243b935467cb6b7c3626a143eec4ad9c3bdac7"   # pragma: allowlist secret

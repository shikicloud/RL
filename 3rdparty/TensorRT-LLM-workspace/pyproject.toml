# Workspace wrapper for TensorRT-LLM.
#
# This package exposes tensorrt-llm as a path source so that:
#   - `uv lock` can resolve the dep graph without building the wheel
#     (prepare_metadata_for_build_wheel returns static metadata fast).
#   - `uv sync --extra trtllm` triggers the actual ~60-min wheel build
#     (build_wheel in _backend.py calls tools/build-custom-trtllm.sh).
#
# Declared as no-build-isolation-package in the root pyproject.toml so the
# build runs in the main venv context and has access to torch / CUDA headers.
#
# Sourced from requirements.txt of the pinned TensorRT-LLM ref (1.3.0rc27 main
# lineage, see [tool.trtllm]). Intentional omissions from requirements.txt:
#   - datasets==3.1.0        → conflicts with nemorl base datasets>=4.0.0
#   - setuptools<80          → conflicts with nemorl override setuptools>=80.10.2
#   - llguidance==0.7.29     → conflicts with nemorl override llguidance>=1.3.0,<1.4.0
#   - triton>=3.7.0,<=3.8.0  → nemorl base manages triton via pytorch-cu130 index
#   - torch>=2.12.0a0        → nemorl overrides torch==2.11.0 (the floor upstream is
#                              triton-pin coupling, not an API requirement)
#   - evaluate               → pulls in conflicting datasets==3.1.0 transitively
#   - build / ninja / meson / patchelf  → build-time only, not runtime deps
#   - cuda-core              → included in cuda-python>=13
#   - graphviz / polygraphy / mcp  → optional dev/test tools
#   - PyNvVideoCodec         → video decode only; no cp313 aarch64 wheel in the pinned range
# Entries that nemorl overrides anyway (kept at the upstream value for the record):
#   flashinfer-python (override 0.6.8.post1), xgrammar (>=0.2.1), apache-tvm-ffi (==0.1.13.post2),
#   nvidia-cudnn-frontend (==1.23.0), nvidia-nccl-cu13 (==2.30.4).

[project]
name = "tensorrt-llm"
version = "1.3.0rc27"
requires-python = ">=3.13"
dependencies = [
  "tensorrt~=10.16.1",
  "mpi4py",
  "numpy>=2.0.0,<2.4",
  "torch>=2.11.0",
  "torchvision",
  "nvidia-modelopt>=0.37.0",
  "nvidia-nccl-cu13>=2.29.7,<=2.30.7",
  "nccl4py>=0.3.1,<0.4",
  "nvidia-cuda-nvrtc",
  "nvidia-cutlass-dsl[cu13]==4.8.0.dev0",
  # 4.8.0.dev0 is a pre-release and pulls pre-release libs packages (the cu12 one
  # unconditionally); uv only admits pre-releases that are requested explicitly,
  # so pin them here rather than enabling pre-releases project-wide.
  "nvidia-cutlass-dsl-libs-base==4.8.0.dev0",
  "nvidia-cutlass-dsl-libs-cu12==4.8.0.dev0",
  "nvidia-cutlass-dsl-libs-cu13==4.8.0.dev0",
  "nvidia-cutlass-dsl-libs-core==4.8.0.dev0",
  "nvidia-matmul-heuristics==0.1.0.27",
  "quack-kernels==0.5.0",
  "nvidia-ml-py>=13",
  "cuda-python>=13",
  "flash-attn-4==4.0.0b19",
  "flashinfer-python==0.6.18",
  "torchao>=0.14.1,<0.16.0",
  "apache-tvm-ffi==0.1.13.post2",
  "torch-c-dlpack-ext==0.1.3",
  "xdsl>=0.59.0",
  "cuda-tile>=1.0.1",
  "nvidia-cuda-tileiras>=13.1,<13.2",
  "nvidia-cudnn-frontend>=1.27.0,<1.28",
  "transformers==5.5.4",
  "accelerate>=1.7.0",
  "safetensors>=0.8.0",
  "sentencepiece>=0.1.99",
  "mistral-common>=1.10.0",
  "tiktoken",
  "diffusers>=0.40.0,<0.41",
  "peft>=0.18.1,<0.19.0",
  "optimum",
  "ftfy",
  "lazy_loader~=0.5",
  "xgrammar==0.1.32",
  "lark",
  "partial_json_parser",
  "jinja2",
  "fastapi>=0.136.3",
  "starlette>=1.3.1",
  "uvicorn",
  "uvloop>=0.19.0",
  "pydantic>=2.9.1",
  "pydantic-settings[yaml]",
  "python-multipart",
  "prometheus_client",
  "prometheus-fastapi-instrumentator>=8.1.0",
  "openai-harmony==0.0.4",
  "etcd-sdk-python==0.0.7",
  "protobuf>=5.27.2",
  "cache-dit>=1.3.5",
  "pillow",
  "soundfile",
  "librosa",
  "h5py==3.12.1",
  "pandas",
  "numexpr",
  "mpmath>=1.3.0",
  "colored",
  "psutil",
  "omegaconf",
  "msgspec",
  "pyzmq",
  "einops",
  "aenum",
  "strenum",
  "llguidance>=1.3.0,<1.4.0",
  "backoff",
  "jsonschema",
  "packaging>=24.2",
  "click>=8.4.2",
  "click_option_group>=0.5.3",
  "ordered-set",
  "msgpack",
  "blake3",
  "llist",
  "pulp",
  "blobfile",
